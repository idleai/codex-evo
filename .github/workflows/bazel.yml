name: Linux Bazel

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full Linux Rust suite
        type: boolean
        default: false
  workflow_call:
    inputs:
      query:
        description: Scoped Bazel test query from hosted preflight
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Linux build and tests
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.CODEX_LINUX_RUNNER || github.event_name == 'workflow_dispatch' && inputs.full == false && vars.CODEX_LINUX_RUNNER || github.event_name != 'pull_request' && vars.IDLE_BACKGROUND_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Prepare Bazel
        id: prepare
        uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: idle-linux
      - name: Resolve compatibility releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(python3 .github/scripts/resolve_exec_server_releases.py)"
          echo "CODEX_COMPAT_RELEASES=$releases" >> "$GITHUB_ENV"
      - name: Build the shipped CLI and app server
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary -- build \
            --platforms=//:local_linux -- \
            //codex-rs/cli:codex //codex-rs/app-server:codex-app-server \
            //codex-rs/code-mode-host:codex-code-mode-host
      - name: Test selected Linux packages
        env:
          TEST_QUERY: ${{ inputs.query }}
          FULL: ${{ inputs.full }}
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$TEST_QUERY" ]]; then
            TEST_QUERY="$(python3 -c 'import os,sys; sys.path.insert(0,".github/scripts"); from select_idle_ci import select; print(select([".github/manual"], full=os.environ["FULL"] == "true")["query"])')"
          fi
          ./.github/scripts/run-bazel-query-ci.sh --output=label -- "$TEST_QUERY" > "$RUNNER_TEMP/idle-tests.txt"
          mapfile -t targets < <(LC_ALL=C sort -u "$RUNNER_TEMP/idle-tests.txt")
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "Selected Linux suite is empty" >&2
            exit 1
          fi
          ./.github/scripts/run-bazel-ci.sh --print-failed-action-summary --print-failed-test-logs -- test \
            --platforms=//:local_linux --skip_incompatible_explicit_targets \
            --test_tag_filters=-argument-comment-lint \
            --test_env=RUST_TEST_THREADS=4 \
            --test_env=CODEX_BAZEL_TEST_SKIP_FILTERS=code_mode,code-mode,CodeMode,v8_ \
            -- "${targets[@]}"
      - name: Save hosted repository cache
        if: always() && !cancelled() && runner.environment == 'github-hosted' && steps.prepare.outputs.repository-cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ steps.prepare.outputs.repository-cache-path }}
          key: ${{ steps.prepare.outputs.repository-cache-key }}
      - name: Upload build logs
        if: always() && !cancelled()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-bazel-logs
          path: ${{ runner.temp }}/bazel-execution-logs
          retention-days: 7
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
