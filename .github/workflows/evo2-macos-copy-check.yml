name: Inspect macOS copy permissions

on:
  push:
    branches: [evo2/macos-copy-check]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 5
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Measure runner hostname resolution alternatives
        shell: bash
        run: |
          sudo python3 - <<'PYPROBE'
          import socket
          import subprocess
          import time
          from pathlib import Path

          def measure(label):
              hostname = socket.gethostname()
              print(f"{label}: hostname={hostname!r}", flush=True)
              for family in [socket.AF_INET, socket.AF_INET6, socket.AF_UNSPEC]:
                  started = time.monotonic()
                  try:
                      result = socket.getaddrinfo(hostname, None, family=family, flags=socket.AI_CANONNAME)
                  except OSError as error:
                      result = str(error)
                  elapsed = time.monotonic() - started
                  print(f"{label}: family={family} elapsed={elapsed:.3f}s result={result}", flush=True)
              return elapsed

          def add_local_alias(hostname):
              assert hostname and not any(character.isspace() for character in hostname)
              hosts = Path('/etc/hosts')
              records = [line.split('#', 1)[0].split() for line in hosts.read_text().splitlines()]
              with hosts.open('a') as stream:
                  for address in ['127.0.0.1', '::1']:
                      if not any(record and record[0] == address and hostname in record[1:] for record in records):
                          stream.write(f'\n{address} {hostname}\n')
              print(hosts.read_text(), flush=True)
              subprocess.run(['dscacheutil', '-flushcache'], check=True)
              subprocess.run(['killall', '-HUP', 'mDNSResponder'], check=True)

          measure('original')
          add_local_alias(socket.gethostname())
          measure('both-address-families-and-cache-flush')
          subprocess.run(['scutil', '--set', 'HostName', 'codex-ci.localhost'], check=True)
          add_local_alias('codex-ci.localhost')
          elapsed = measure('explicit-localhost-name')
          if elapsed >= 1:
              raise RuntimeError(f'Hostname resolution is still slow: {elapsed:.3f}s')
          PYPROBE
