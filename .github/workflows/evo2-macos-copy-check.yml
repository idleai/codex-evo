name: Inspect macOS copy permissions

on:
  push:
    branches: [evo2/macos-copy-check]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-apple-darwin
          cache-scope: bazel-test
      - name: Inspect and configure runner hostname lookup
        shell: bash
        run: |
          sudo python3 - <<'PY'
          import socket
          import time
          from pathlib import Path

          hostname = socket.gethostname()
          assert hostname and not any(character.isspace() for character in hostname)
          started = time.monotonic()
          try:
              resolved = socket.getaddrinfo(hostname, None, flags=socket.AI_CANONNAME)
              print(f"Hostname lookup before hosts entry: {time.monotonic() - started:.3f}s {resolved}", flush=True)
          except OSError as error:
              print(f"Hostname lookup before hosts entry: {time.monotonic() - started:.3f}s {error}", flush=True)
          hosts = Path('/etc/hosts')
          aliases = {name.lower().rstrip('.') for line in hosts.read_text().splitlines() for name in line.split('#', 1)[0].split()[1:]}
          if hostname.lower().rstrip('.') not in aliases:
              with hosts.open('a') as stream:
                  stream.write(f'\n127.0.0.1 {hostname}\n')
          started = time.monotonic()
          resolved = socket.getaddrinfo(hostname, None, flags=socket.AI_CANONNAME)
          print(f"Hostname lookup after hosts entry: {time.monotonic() - started:.3f}s {resolved}", flush=True)
          PY
      - name: Inspect the copy-permission regressions
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --remote-download-toplevel \
            -- \
            test \
            --lockfile_mode=error \
            --test_sharding_strategy=disabled \
            --test_output=all \
            --test_arg=copy_file_uses_each_environments_permissions \
            --test_arg=--test-threads=1 \
            -- \
            //codex-rs/ext/multi-env-copy-file:multi-env-copy-file-copy_file-test
