name: Inspect macOS copy permissions

on:
  push:
    branches: [evo2/macos-copy-check]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-apple-darwin
          cache-scope: bazel-test
      - name: Configure both local hostname address families
        shell: bash
        run: |
          sudo python3 - <<'PYHOST'
          import socket
          import subprocess
          import time
          from pathlib import Path

          hostname = socket.gethostname()
          assert hostname and not any(character.isspace() for character in hostname)
          hosts = Path('/etc/hosts')
          records = [line.split('#', 1)[0].split() for line in hosts.read_text().splitlines()]
          with hosts.open('a') as stream:
              for address in ['127.0.0.1', '::1']:
                  if not any(record and record[0] == address and hostname.lower().rstrip('.') in [alias.lower().rstrip('.') for alias in record[1:]] for record in records):
                      stream.write(f'\n{address} {hostname}\n')
          subprocess.run(['dscacheutil', '-flushcache'], check=True)
          subprocess.run(['killall', '-HUP', 'mDNSResponder'], check=True)
          started = time.monotonic()
          resolved = socket.getaddrinfo(hostname, None, flags=socket.AI_CANONNAME)
          elapsed = time.monotonic() - started
          print(f'Hostname lookup after both local address entries: {elapsed:.3f}s {resolved}', flush=True)
          if elapsed >= 1:
              raise RuntimeError(f'Hostname resolution is still slow: {elapsed:.3f}s')
          PYHOST
      - name: Inspect the copy-permission regressions
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary \
            --print-failed-test-logs \
            --remote-download-toplevel \
            -- \
            test \
            --lockfile_mode=error \
            --test_sharding_strategy=disabled \
            --test_output=all \
            --test_arg=copy_file_uses_each_environments_permissions \
            --test_arg=--test-threads=1 \
            -- \
            //codex-rs/ext/multi-env-copy-file:multi-env-copy-file-copy_file-test
