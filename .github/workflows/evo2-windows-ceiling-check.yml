name: Check native Windows execution permissions

on:
  push:
    branches: [evo2/windows-ceiling-check]

permissions:
  contents: read

jobs:
  permissions:
    runs-on: windows-2025
    timeout-minutes: 90
    environment:
      name: bazel
      deployment: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-pc-windows-gnullvm
          cache-scope: bazel-test
      - name: Check the execution permission ceiling on Windows
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          ./.github/scripts/run-bazel-ci.sh \
            --print-failed-action-summary --print-failed-test-logs \
            --windows-cross-compile --remote-download-toplevel -- \
            test --lockfile_mode=error --test_sharding_strategy=disabled \
            --flaky_test_attempts=1 --test_output=all \
            --test_arg=frozen_execution --test_arg=--nocapture --test_arg=--test-threads=1 -- \
            //codex-rs/core:core-all-test-windows-cross
      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree
