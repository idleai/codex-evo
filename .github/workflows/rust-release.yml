name: rust-release

on:
  push:
    tags: ["rust-v*.*.*"]

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    name: Complete release validation
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/blocking-ci.yml
    secrets: inherit

  build:
    name: Linux release package
    runs-on: ${{ vars.IDLE_BACKGROUND_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      CODEX_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate release version
        run: |
          python3 .github/scripts/releases.py "${GITHUB_REF_NAME#rust-v}"
          python3 -c 'import os,tomllib; assert tomllib.load(open("codex-rs/Cargo.toml","rb"))["workspace"]["package"]["version"] == os.environ["GITHUB_REF_NAME"].removeprefix("rust-v")'
      - uses: ./.github/actions/prepare-bazel-ci
        with:
          target: x86_64-unknown-linux-gnu
          cache-scope: idle-linux-release
      - name: Build Linux release binaries with pinned prebuilt V8
        run: |
          ./.github/scripts/run-bazel-ci.sh --remote-download-toplevel -- build \
            --compilation_mode=opt --platforms=//:local_linux -- \
            //codex-rs/cli:codex //codex-rs/app-server:codex-app-server \
            //codex-rs/code-mode-host:codex-code-mode-host //codex-rs/bwrap:bwrap
      - name: Assemble Linux packages
        run: |
          mkdir -p dist
          python3 scripts/build_codex_package.py --target x86_64-unknown-linux-gnu \
            --entrypoint-bin bazel-bin/codex-rs/cli/codex \
            --code-mode-host-bin bazel-bin/codex-rs/code-mode-host/codex-code-mode-host \
            --bwrap-bin bazel-bin/codex-rs/bwrap/bwrap \
            --package-dir dist/codex-package --archive-output dist/codex-package-x86_64-unknown-linux-gnu.tar.gz
          python3 scripts/build_codex_package.py --target x86_64-unknown-linux-gnu --variant codex-app-server \
            --entrypoint-bin bazel-bin/codex-rs/app-server/codex-app-server \
            --code-mode-host-bin bazel-bin/codex-rs/code-mode-host/codex-code-mode-host \
            --bwrap-bin bazel-bin/codex-rs/bwrap/bwrap \
            --package-dir dist/codex-app-server-package --archive-output dist/codex-app-server-package-x86_64-unknown-linux-gnu.tar.gz
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: linux-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish Linux release
    needs: [build, validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: dist
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true
          else
            args=()
            if [[ "${GITHUB_REF_NAME#rust-v}" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "Linux GNU packages." "${args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
