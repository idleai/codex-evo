name: setup-ci
description: Prepare common tools and environment shared by CI jobs.
outputs:
  bazel-output-base:
    description: Filesystem path used for Bazel's output base.
    value: ${{ steps.configure_ci_build_paths.outputs.bazel-output-base }}
  cargo-target-dir:
    description: Filesystem path used for Cargo's target directory.
    value: ${{ steps.configure_ci_build_paths.outputs.cargo-target-dir }}

runs:
  using: composite
  steps:
    # setup-ci expects either this step or the Unix fallback below to define
    # CI_BUILD_ROOT. Windows uses a Dev Drive because Cargo and Bazel
    # spend significant time reading and writing build/cache trees.
    - name: Configure Dev Drive (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./.github/scripts/setup-dev-drive.ps1

    - name: Configure CI build root (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: echo "CI_BUILD_ROOT=$HOME/.cache/codex-ci" >> "$GITHUB_ENV"

    - name: Enable unprivileged user namespaces (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

    - name: Allow high descriptor tests (macOS)
      if: runner.os == 'macOS' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        # The PTY fallback test opens descriptors beyond Darwin's OPEN_MAX.
        # Raising RLIMIT_NOFILE alone cannot exceed this separate kernel cap.
        current_max_files="$(sysctl -n kern.maxfiles)"
        current_max_files_per_process="$(sysctl -n kern.maxfilesperproc)"
        if (( current_max_files < 32768 )); then
          sudo sysctl -w kern.maxfiles=32768
        fi
        if (( current_max_files_per_process < 16384 )); then
          sudo sysctl -w kern.maxfilesperproc=16384
        fi

    - name: Resolve both local hostname address families (macOS)
      if: runner.os == 'macOS' && runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo python3 - <<'PYHOST'
        import socket
        import subprocess
        import time
        from pathlib import Path

        hostname = socket.gethostname()
        assert hostname and not any(character.isspace() for character in hostname)
        hosts = Path('/etc/hosts')
        records = [line.split('#', 1)[0].split() for line in hosts.read_text().splitlines()]
        with hosts.open('a') as stream:
            for address in ['127.0.0.1', '::1']:
                if not any(record and record[0] == address and hostname.lower().rstrip('.') in [alias.lower().rstrip('.') for alias in record[1:]] for record in records):
                    stream.write(f'\n{address} {hostname}\n')
        subprocess.run(['dscacheutil', '-flushcache'], check=True)
        subprocess.run(['killall', '-HUP', 'mDNSResponder'], check=True)
        started = time.monotonic()
        resolved = socket.getaddrinfo(hostname, None, flags=socket.AI_CANONNAME)
        elapsed = time.monotonic() - started
        print(f'Hostname lookup after both local address entries: {elapsed:.3f}s {resolved}', flush=True)
        if elapsed >= 1:
            raise RuntimeError(f'Hostname resolution is still slow: {elapsed:.3f}s')
        PYHOST

    - name: Configure CI build paths
      id: configure_ci_build_paths
      shell: bash
      run: |
        set -euo pipefail
        # setup-bazel passes output_base explicitly, so keep both it and the
        # user root under the shared build root. Keep these directory names tiny
        # on every platform so Windows Bazel paths do not overflow argv or
        # confuse test MANIFEST handling.
        bazel_output_base="$CI_BUILD_ROOT/o"
        bazel_output_user_root="$CI_BUILD_ROOT/b"
        bazel_repository_cache="$CI_BUILD_ROOT/bazel-repository-cache"
        bazel_repo_contents_cache="$CI_BUILD_ROOT/bazel-repo-contents-cache-$GITHUB_RUN_ID-$GITHUB_JOB"
        cargo_target_dir="$CI_BUILD_ROOT/cargo-target"
        tmp="$CI_BUILD_ROOT/tmp"

        build_dirs=(
          "$bazel_output_base"
          "$bazel_output_user_root"
          "$bazel_repository_cache"
          "$bazel_repo_contents_cache"
          "$cargo_target_dir"
          "$tmp"
        )
        mkdir -p "${build_dirs[@]}"
        if [[ "${RUNNER_ENVIRONMENT:-}" == "self-hosted" ]]; then
          # Retain compiled outputs on persistent runners even without RBE.
          mkdir -p "$CI_BUILD_ROOT/bazel-disk-cache"
          echo "BAZEL_DISK_CACHE=$CI_BUILD_ROOT/bazel-disk-cache" >> "$GITHUB_ENV"
        fi
        echo "bazel-output-base=$bazel_output_base" >> "$GITHUB_OUTPUT"
        echo "cargo-target-dir=$cargo_target_dir" >> "$GITHUB_OUTPUT"

        {
          echo "CODEX_REPO_ROOT=$GITHUB_WORKSPACE"
          echo "BAZEL_OUTPUT_BASE=$bazel_output_base"
          echo "BAZEL_OUTPUT_USER_ROOT=$bazel_output_user_root"
          echo "BAZEL_REPOSITORY_CACHE=$bazel_repository_cache"
          echo "BAZEL_REPO_CONTENTS_CACHE=$bazel_repo_contents_cache"
          echo "CARGO_TARGET_DIR=$cargo_target_dir"
          echo "TEMP=$tmp"
          echo "TMP=$tmp"
        } >> "$GITHUB_ENV"

    - name: Prefer the Git CLI for Cargo git dependencies
      shell: bash
      run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

    - name: Configure curl retries for DotSlash
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/dotslash-curl" && echo retry-all-errors > "$RUNNER_TEMP/dotslash-curl/.curlrc"

    - name: Install DotSlash
      uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2
      env:
        CURL_HOME: ${{ runner.temp }}/dotslash-curl

    - name: Install just
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
      with:
        tool: just@1.51.0

    # Some integration tests spawn DotSlash from a stable system path rather
    # than inheriting the action-local PATH entry.
    - name: Make DotSlash available in PATH (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [[ -w /usr/local/bin ]]; then
          cp "$(which dotslash)" /usr/local/bin
        else
          sudo cp "$(which dotslash)" /usr/local/bin
        fi

    - name: Make DotSlash available in PATH (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Copy-Item (Get-Command dotslash).Source -Destination "$env:LOCALAPPDATA\Microsoft\WindowsApps\dotslash.exe"

    - name: Enable Git long paths (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.longpaths true
